<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex Interactiva & Favoritos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            pokeRed: '#EE1515',
            pokeDarkRed: '#CC0000',
            pokeDark: '#121212',
            pokeCardDark: '#1E1E24',
          },
          animation: {
            'bounce-slow': 'bounce 2s infinite',
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 3s linear infinite',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Glassmorphism & Effects */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass {
      background: rgba(30, 30, 36, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .dark ::-webkit-scrollbar-track {
      background: #1e1e24;
    }
    ::-webkit-scrollbar-thumb {
      background: #ee1515;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #cc0000;
    }

    /* Type Badge Background Colors */
    .type-normal { background-color: #A8A878; }
    .type-fire { background-color: #F08030; }
    .type-water { background-color: #6890F0; }
    .type-grass { background-color: #78C850; }
    .type-electric { background-color: #F8D030; text-color: #111; }
    .type-ice { background-color: #98D8D8; }
    .type-fighting { background-color: #C03028; }
    .type-poison { background-color: #A040A0; }
    .type-ground { background-color: #E0C068; }
    .type-flying { background-color: #A890F0; }
    .type-psychic { background-color: #F85888; }
    .type-bug { background-color: #A8B820; }
    .type-rock { background-color: #B8A038; }
    .type-ghost { background-color: #705898; }
    .type-dragon { background-color: #7038F8; }
    .type-steel { background-color: #B8B8D0; }
    .type-fairy { background-color: #EE99AC; }
    .type-dark { background-color: #705848; }

    .pokemon-card {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .pokemon-card:hover {
      transform: translateY(-6px) scale(1.02);
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-pokeDark text-gray-800 dark:text-gray-100 min-h-screen font-sans transition-colors duration-300">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-pokeRed shadow-lg text-white border-b-4 border-black/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
      <!-- Logo & Brand -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
        <div class="relative flex items-center justify-center w-10 h-10 bg-white rounded-full border-4 border-black shadow-md">
          <div class="w-4 h-4 bg-red-600 rounded-t-full border-b-2 border-black"></div>
          <div class="absolute inset-0 m-auto w-3 h-3 bg-white border-2 border-black rounded-full flex items-center justify-center">
            <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
          </div>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-wider flex items-center gap-2">
            POKÉDEX <span class="text-xs bg-black/30 px-2 py-0.5 rounded-full font-normal">v2.5</span>
          </h1>
          <p class="text-xs text-red-100 font-medium">¡Explora y comparte tus Pokémon!</p>
        </div>
      </div>

      <!-- Actions (Favorites View Toggle, Share WhatsApp, Dark Mode) -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- Favorites Filter Toggle Button -->
        <button id="favTabBtn" onclick="toggleFavoritesView()" class="relative px-4 py-2 bg-white/20 hover:bg-white/30 rounded-xl font-semibold text-sm transition flex items-center gap-2 border border-white/20">
          <i class="fa-solid fa-heart text-red-300" id="favTabIcon"></i>
          <span id="favTabLabel">Favoritos</span>
          <span id="favBadge" class="bg-yellow-400 text-black text-xs font-black px-2 py-0.5 rounded-full ml-1 hidden">0</span>
        </button>

        <!-- Share All Favorites via WhatsApp -->
        <button onclick="shareFavoritesWhatsApp()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-semibold text-sm shadow-md transition flex items-center gap-2">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span class="hidden sm:inline">Enviar Lista</span>
        </button>

        <!-- Dark/Light Theme Toggle -->
        <button onclick="toggleTheme()" class="p-2.5 bg-black/20 hover:bg-black/30 rounded-xl transition text-white" title="Cambiar Tema">
          <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Search & Filter Controls -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="glass p-4 rounded-2xl shadow-md border border-gray-200 dark:border-gray-800 mb-8 space-y-4">
      <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
        <!-- Search Input -->
        <div class="relative w-full md:w-1/2">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearch()"
            placeholder="Buscar Pokémon por nombre o número (#001)..." 
            class="w-full pl-11 pr-10 py-3 bg-white dark:bg-pokeDark border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-pokeRed text-gray-800 dark:text-white transition shadow-sm text-sm sm:text-base"
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-white">
            <i class="fa-solid fa-circle-xmark text-lg"></i>
          </button>
        </div>

        <!-- Generation / Range Selector -->
        <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
          <label for="genSelect" class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 whitespace-nowrap">
            Generación:
          </label>
          <select id="genSelect" onchange="changeGeneration(this.value)" class="bg-white dark:bg-pokeDark border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-white text-sm rounded-xl p-2.5 focus:ring-pokeRed focus:border-pokeRed font-medium">
            <option value="1">Gen 1 (Kanto: 1 - 151)</option>
            <option value="2">Gen 2 (Johto: 152 - 251)</option>
            <option value="3">Gen 3 (Hoenn: 252 - 386)</option>
            <option value="all">Ver Todos (151 por defecto)</option>
          </select>

          <!-- Sorting -->
          <select id="sortSelect" onchange="handleSort(this.value)" class="bg-white dark:bg-pokeDark border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-white text-sm rounded-xl p-2.5 focus:ring-pokeRed focus:border-pokeRed font-medium">
            <option value="id-asc">Número (Ascendente)</option>
            <option value="id-desc">Número (Descendente)</option>
            <option value="name-asc">Nombre (A - Z)</option>
            <option value="name-desc">Nombre (Z - A)</option>
          </select>
        </div>
      </div>

      <!-- Type Filter Pills -->
      <div class="pt-2 border-t border-gray-200 dark:border-gray-700/60">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Filtrar por Tipo:</span>
          <button onclick="clearTypeFilter()" id="clearTypeBtn" class="text-xs text-pokeRed dark:text-red-400 font-semibold hover:underline hidden">
            Limpiar filtro de tipo
          </button>
        </div>
        <div class="flex flex-wrap gap-1.5 sm:gap-2 max-h-24 overflow-y-auto pr-1" id="typeFiltersContainer">
          <!-- Dynamically populated type badges -->
        </div>
      </div>
    </div>

    <!-- Active Filter Notice Banner -->
    <div id="filterBanner" class="hidden mb-6 p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-filter text-pokeRed"></i>
        <span id="filterBannerText" class="text-sm font-semibold text-gray-700 dark:text-gray-200"></span>
      </div>
      <button onclick="resetFilters()" class="text-xs bg-pokeRed text-white px-3 py-1.5 rounded-lg font-bold hover:bg-pokeDarkRed transition">
        Ver Todos
      </button>
    </div>

    <!-- Pokémon Grid Container -->
    <div id="pokemonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">
      <!-- Pokémon Cards populated by JS -->
    </div>

    <!-- Skeleton Loader State -->
    <div id="loadingSkeleton" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">
      <!-- 12 Skeleton cards -->
      <template id="skeletonTemplate">
        <div class="bg-white dark:bg-pokeCardDark rounded-2xl p-4 shadow-sm animate-pulse border border-gray-200 dark:border-gray-800">
          <div class="w-16 h-4 bg-gray-200 dark:bg-gray-700 rounded mb-2"></div>
          <div class="w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto my-3"></div>
          <div class="w-3/4 h-5 bg-gray-200 dark:bg-gray-700 rounded mx-auto mb-2"></div>
          <div class="flex justify-center gap-1">
            <div class="w-12 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
            <div class="w-12 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="w-24 h-24 mx-auto mb-4 text-gray-300 dark:text-gray-600 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800">
        <i class="fa-solid fa-ghost text-5xl"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-700 dark:text-gray-300 mb-1" id="emptyTitle">No se encontraron Pokémon</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm max-w-md mx-auto" id="emptySubtitle">Intenta buscar con otro nombre o ajusta los filtros de búsqueda.</p>
      <button onclick="resetFilters()" class="mt-4 px-5 py-2.5 bg-pokeRed text-white rounded-xl font-bold hover:bg-pokeDarkRed transition shadow-md">
        Restablecer Filtros
      </button>
    </div>
  </main>

  <!-- Pokémon Detail Modal (Ficha Técnica) -->
  <div id="pokemonModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="relative w-full max-w-lg bg-white dark:bg-pokeCardDark rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col border border-gray-200 dark:border-gray-800" id="modalCard">
      
      <!-- Modal Header Banner -->
      <div id="modalHeader" class="relative p-6 text-white transition-colors duration-500 flex justify-between items-start">
        <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 bg-black/30 hover:bg-black/50 text-white rounded-full flex items-center justify-center transition focus:outline-none z-10">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <div>
          <span id="modalId" class="text-xs font-black tracking-wider uppercase px-3 py-1 rounded-full bg-black/20 backdrop-blur-sm border border-white/20">#000</span>
          <h2 id="modalName" class="text-3xl font-extrabold capitalize mt-2 drop-shadow">Pokémon</h2>
          <div id="modalTypes" class="flex gap-2 mt-2">
            <!-- Dynamic Types -->
          </div>
        </div>

        <!-- Quick Favorite Toggle in Modal Header -->
        <button id="modalFavBtn" onclick="toggleModalFavorite()" class="w-11 h-11 bg-white/20 hover:bg-white/30 rounded-2xl flex items-center justify-center backdrop-blur-md transition border border-white/30 text-white text-xl">
          <i class="fa-regular fa-heart"></i>
        </button>
      </div>

      <!-- Modal Content Body -->
      <div class="p-6 overflow-y-auto space-y-6 flex-1 bg-white dark:bg-pokeCardDark">
        
        <!-- Artwork & Sound Playback -->
        <div class="relative flex flex-col items-center -mt-16">
          <div class="relative group">
            <img id="modalImage" src="" alt="Pokemon" class="w-48 h-48 object-contain drop-shadow-2xl transition-transform duration-300 group-hover:scale-110" />
          </div>
          
          <!-- Audio Cry Button -->
          <button id="playCryBtn" onclick="playPokemonCry()" class="mt-2 px-4 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-xs font-bold rounded-full transition flex items-center gap-2 border border-gray-300 dark:border-gray-700">
            <i class="fa-solid fa-volume-high text-pokeRed"></i>
            <span>Escuchar Grito</span>
          </button>
        </div>

        <!-- Physical Characteristics Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-center bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
          <div>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-semibold">Altura</p>
            <p id="modalHeight" class="text-base font-extrabold text-gray-800 dark:text-gray-100">0.0 m</p>
          </div>
          <div>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-semibold">Peso</p>
            <p id="modalWeight" class="text-base font-extrabold text-gray-800 dark:text-gray-100">0.0 kg</p>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <p class="text-xs text-gray-500 dark:text-gray-400 font-semibold">Exp. Base</p>
            <p id="modalExp" class="text-base font-extrabold text-gray-800 dark:text-gray-100">0 XP</p>
          </div>
        </div>

        <!-- Abilities -->
        <div>
          <h4 class="text-sm font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Habilidades</h4>
          <div id="modalAbilities" class="flex flex-wrap gap-2">
            <!-- Dynamic abilities -->
          </div>
        </div>

        <!-- Base Stats -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <h4 class="text-sm font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Estadísticas Base</h4>
            <span id="modalTotalStats" class="text-xs font-black bg-gray-200 dark:bg-gray-800 px-2.5 py-1 rounded-lg text-pokeRed dark:text-red-400">Total: 0</span>
          </div>
          <div id="modalStats" class="space-y-2.5">
            <!-- Dynamic stats progress bars -->
          </div>
        </div>

      </div>

      <!-- Modal Footer with WhatsApp Share Button -->
      <div class="p-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex gap-3">
        <button id="modalShareBtn" onclick="shareCurrentPokemonWhatsApp()" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-md transition flex items-center justify-center gap-2 text-sm sm:text-base">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Compartir por WhatsApp</span>
        </button>
        <button onclick="closeModal()" class="px-5 py-3 bg-gray-200 hover:bg-gray-300 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl font-bold transition text-sm">
          Cerrar
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 bg-gray-900 text-white dark:bg-white dark:text-gray-900 px-5 py-3.5 rounded-2xl shadow-2xl border border-gray-800 dark:border-gray-200">
    <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600 text-xl" id="toastIcon"></i>
    <span id="toastMessage" class="text-sm font-semibold">Mensaje de notificación</span>
  </div>

  <script>
    /* JavaScript Logic & Application State */
    
    // Pokemon Types Configuration
    const TYPE_TRANSLATIONS = {
      normal: 'Normal',
      fire: 'Fuego',
      water: 'Agua',
      grass: 'Planta',
      electric: 'Eléctrico',
      ice: 'Hielo',
      fighting: 'Lucha',
      poison: 'Veneno',
      ground: 'Tierra',
      flying: 'Volador',
      psychic: 'Psíquico',
      bug: 'Bicho',
      rock: 'Roca',
      ghost: 'Fantasma',
      dragon: 'Dragón',
      steel: 'Acero',
      fairy: 'Hada',
      dark: 'Siniestro'
    };

    const STAT_TRANSLATIONS = {
      hp: 'PS',
      attack: 'Ataque',
      defense: 'Defensa',
      'special-attack': 'Atq. Esp.',
      'special-defense': 'Def. Esp.',
      speed: 'Velocidad'
    };

    // State
    let allPokemon = [];
    let favorites = JSON.parse(localStorage.getItem('pokedex_favorites_v1')) || [];
    let currentFilterType = null;
    let currentSearch = '';
    let currentGen = '1';
    let currentSort = 'id-asc';
    let showingFavoritesOnly = false;
    let activePokemonDetail = null;

    window.addEventListener('DOMContentLoaded', () => {
      // Render Skeleton loaders
      renderSkeletons();
      // Initialize Types Filter Pills
      initTypeFilters();
      // Load Initial Pokemon List
      loadPokemonRange(1, 151);
      // Update Favorites Badge Count
      updateFavoritesBadge();

      // Check System Theme
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-lg';
      }
    });

    async function loadPokemonRange(start, limit) {
      showLoading(true);
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon?offset=${start - 1}&limit=${limit}`);
        const data = await response.json();

        // Fetch individual details concurrently in batches for speed
        const detailedPromises = data.results.map(async (p) => {
          const res = await fetch(p.url);
          return await res.json();
        });

        allPokemon = await Promise.all(detailedPromises);
        showLoading(false);
        applyFiltersAndRender();
      } catch (error) {
        console.error('Error fetching Pokemon data:', error);
        showLoading(false);
        showToast('Error al cargar datos de Pokémon', 'error');
      }
    }

    function changeGeneration(val) {
      resetFiltersUI();
      if (val === '1') loadPokemonRange(1, 151);
      else if (val === '2') loadPokemonRange(152, 100);
      else if (val === '3') loadPokemonRange(252, 135);
      else if (val === 'all') loadPokemonRange(1, 151);
    }

    function initTypeFilters() {
      const container = document.getElementById('typeFiltersContainer');
      container.innerHTML = '';

      Object.keys(TYPE_TRANSLATIONS).forEach(type => {
        const badge = document.createElement('button');
        badge.className = `type-${type} text-white text-xs px-3 py-1 rounded-full font-bold shadow-sm hover:opacity-90 transition opacity-80 hover:opacity-100 flex items-center gap-1`;
        badge.innerHTML = `<span>${TYPE_TRANSLATIONS[type]}</span>`;
        badge.onclick = () => filterByType(type);
        badge.dataset.type = type;
        container.appendChild(badge);
      });
    }

    function applyFiltersAndRender() {
      let filtered = [...allPokemon];

      // 1. Favorites tab filter
      if (showingFavoritesOnly) {
        filtered = filtered.filter(p => favorites.includes(p.id));
      }

      // 2. Type Filter
      if (currentFilterType) {
        filtered = filtered.filter(p => p.types.some(t => t.type.name === currentFilterType));
      }

      // 3. Search Query (Name or ID)
      if (currentSearch.trim() !== '') {
        const q = currentSearch.toLowerCase().trim();
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(q) || 
          p.id.toString().padStart(3, '0').includes(q) ||
          p.id.toString() === q
        );
      }

      // 4. Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'id-asc') return a.id - b.id;
        if (currentSort === 'id-desc') return b.id - a.id;
        if (currentSort === 'name-asc') return a.name.localeCompare(b.name);
        if (currentSort === 'name-desc') return b.name.localeCompare(a.name);
        return 0;
      });

      renderPokemonGrid(filtered);
      updateFilterBanner();
    }

    function renderPokemonGrid(list) {
      const grid = document.getElementById('pokemonGrid');
      const emptyState = document.getElementById('emptyState');

      grid.innerHTML = '';

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        grid.classList.add('hidden');
        
        if (showingFavoritesOnly) {
          document.getElementById('emptyTitle').innerText = 'No tienes Pokémon favoritos guardados';
          document.getElementById('emptySubtitle').innerText = 'Haz clic en el corazón de cualquier tarjeta de Pokémon para agregarlo a tu lista.';
        } else {
          document.getElementById('emptyTitle').innerText = 'No se encontraron Pokémon';
          document.getElementById('emptySubtitle').innerText = 'Intenta buscar con otro nombre o ajusta los filtros de búsqueda.';
        }
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      list.forEach(pokemon => {
        const card = createPokemonCardHTML(pokemon);
        grid.appendChild(card);
      });
    }

    function createPokemonCardHTML(pokemon) {
      const isFav = favorites.includes(pokemon.id);
      const card = document.createElement('div');
      card.className = 'pokemon-card bg-white dark:bg-pokeCardDark rounded-2xl p-4 shadow-md hover:shadow-xl border border-gray-200 dark:border-gray-800/80 cursor-pointer relative group flex flex-col justify-between';
      
      // Image source logic (Official Artwork fallback to default sprite)
      const spriteUrl = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
      const formattedId = `#${pokemon.id.toString().padStart(3, '0')}`;
      
      // Primary type color for header glow or badge
      const primaryType = pokemon.types[0].type.name;

      card.innerHTML = `
        <div>
          <!-- Header with ID & Favorite Button -->
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-black text-gray-400 dark:text-gray-500">${formattedId}</span>
            <button onclick="event.stopPropagation(); toggleFavorite(${pokemon.id})" class="text-lg p-1 transition transform active:scale-125 focus:outline-none" title="${isFav ? 'Quitar de Favoritos' : 'Agregar a Favoritos'}">
              <i class="${isFav ? 'fa-solid fa-heart text-red-500 scale-110' : 'fa-regular fa-heart text-gray-400 hover:text-red-400'}"></i>
            </button>
          </div>

          <!-- Pokemon Sprite -->
          <div class="relative py-2 flex items-center justify-center">
            <div class="absolute w-20 h-20 bg-gradient-to-tr from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-700/50 rounded-full opacity-60 group-hover:scale-110 transition duration-300"></div>
            <img src="${spriteUrl}" alt="${pokemon.name}" loading="lazy" class="w-28 h-28 object-contain relative z-10 transition-transform duration-300 group-hover:scale-110 drop-shadow" />
          </div>

          <!-- Name -->
          <h3 class="font-bold text-center capitalize text-base sm:text-lg text-gray-800 dark:text-gray-100 truncate mt-1">
            ${pokemon.name}
          </h3>

          <!-- Types Badges -->
          <div class="flex justify-center gap-1.5 mt-2 flex-wrap">
            ${pokemon.types.map(t => `
              <span class="type-${t.type.name} text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider">
                ${TYPE_TRANSLATIONS[t.type.name] || t.type.name}
              </span>
            `).join('')}
          </div>
        </div>

        <!-- Quick View Action Indicator -->
        <div class="mt-3 pt-2 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center text-xs text-gray-400 group-hover:text-pokeRed transition">
          <span class="font-semibold text-[11px]">Ver Ficha</span>
          <i class="fa-solid fa-chevron-right text-[10px] transform group-hover:translate-x-1 transition"></i>
        </div>
      `;

      card.onclick = () => openPokemonModal(pokemon);
      return card;
    }

    function openPokemonModal(pokemon) {
      activePokemonDetail = pokemon;
      const modal = document.getElementById('pokemonModal');
      const modalCard = document.getElementById('modalCard');
      const primaryType = pokemon.types[0].type.name;

      // Set Header color dynamically according to primary type
      const modalHeader = document.getElementById('modalHeader');
      modalHeader.className = `relative p-6 text-white transition-colors duration-500 flex justify-between items-start type-${primaryType}`;

      // Set Info
      document.getElementById('modalId').innerText = `#${pokemon.id.toString().padStart(3, '0')}`;
      document.getElementById('modalName').innerText = pokemon.name;
      
      // Types
      const modalTypes = document.getElementById('modalTypes');
      modalTypes.innerHTML = pokemon.types.map(t => `
        <span class="bg-black/30 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-white/20">
          ${TYPE_TRANSLATIONS[t.type.name] || t.type.name}
        </span>
      `).join('');

      // Sprite
      const spriteUrl = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
      document.getElementById('modalImage').src = spriteUrl;

      // Stats calculations (Physical)
      document.getElementById('modalHeight').innerText = `${(pokemon.height / 10).toFixed(1)} m`;
      document.getElementById('modalWeight').innerText = `${(pokemon.weight / 10).toFixed(1)} kg`;
      document.getElementById('modalExp').innerText = `${pokemon.base_experience || 'N/A'}`;

      // Abilities
      const abilitiesContainer = document.getElementById('modalAbilities');
      abilitiesContainer.innerHTML = pokemon.abilities.map(a => `
        <span class="px-3 py-1 bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 text-xs font-bold rounded-lg border border-gray-200 dark:border-gray-700 capitalize">
          ${a.ability.name.replace('-', ' ')} ${a.is_hidden ? '<span class="text-pokeRed text-[10px] ml-1">(Oculta)</span>' : ''}
        </span>
      `).join('');

      // Stats Bars
      const statsContainer = document.getElementById('modalStats');
      statsContainer.innerHTML = '';
      let totalStats = 0;

      pokemon.stats.forEach(s => {
        totalStats += s.base_stat;
        const statPercent = Math.min(100, Math.round((s.base_stat / 180) * 100));
        const statName = STAT_TRANSLATIONS[s.stat.name] || s.stat.name;
        
        let barColor = 'bg-blue-500';
        if (s.base_stat >= 100) barColor = 'bg-emerald-500';
        else if (s.base_stat < 50) barColor = 'bg-amber-500';

        statsContainer.innerHTML += `
          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-gray-600 dark:text-gray-400">${statName}</span>
              <span class="text-gray-800 dark:text-gray-200 font-extrabold">${s.base_stat}</span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 h-2.5 rounded-full overflow-hidden">
              <div class="${barColor} h-2.5 rounded-full transition-all duration-700" style="width: ${statPercent}%"></div>
            </div>
          </div>
        `;
      });

      document.getElementById('modalTotalStats').innerText = `Total: ${totalStats}`;

      // Update Favorite Icon in Modal Header
      updateModalFavoriteBtn();

      // Show Modal with Animation
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-95');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('pokemonModal');
      const modalCard = document.getElementById('modalCard');
      
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');
      modal.classList.add('opacity-0', 'pointer-events-none');
      activePokemonDetail = null;
    }

    function toggleFavorite(id) {
      const index = favorites.indexOf(id);
      if (index > -1) {
        favorites.splice(index, 1);
        showToast('Eliminado de tus favoritos', 'info');
      } else {
        favorites.push(id);
        showToast('¡Guardado en tus favoritos!', 'success');
      }

      localStorage.setItem('pokedex_favorites_v1', JSON.stringify(favorites));
      updateFavoritesBadge();
      updateModalFavoriteBtn();
      applyFiltersAndRender();
    }

    function toggleModalFavorite() {
      if (activePokemonDetail) {
        toggleFavorite(activePokemonDetail.id);
      }
    }

    function updateModalFavoriteBtn() {
      if (!activePokemonDetail) return;
      const isFav = favorites.includes(activePokemonDetail.id);
      const btn = document.getElementById('modalFavBtn');
      if (isFav) {
        btn.innerHTML = `<i class="fa-solid fa-heart text-red-500 scale-110"></i>`;
      } else {
        btn.innerHTML = `<i class="fa-regular fa-heart"></i>`;
      }
    }

    function updateFavoritesBadge() {
      const badge = document.getElementById('favBadge');
      badge.innerText = favorites.length;
      if (favorites.length > 0) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleFavoritesView() {
      showingFavoritesOnly = !showingFavoritesOnly;
      const btn = document.getElementById('favTabBtn');
      const label = document.getElementById('favTabLabel');

      if (showingFavoritesOnly) {
        btn.classList.add('bg-white', 'text-pokeRed', 'shadow-md');
        btn.classList.remove('bg-white/20', 'text-white');
        label.innerText = 'Viendo Favoritos';
      } else {
        btn.classList.remove('bg-white', 'text-pokeRed', 'shadow-md');
        btn.classList.add('bg-white/20', 'text-white');
        label.innerText = 'Favoritos';
      }

      applyFiltersAndRender();
    }

    function shareCurrentPokemonWhatsApp() {
      if (!activePokemonDetail) return;

      const p = activePokemonDetail;
      const types = p.types.map(t => TYPE_TRANSLATIONS[t.type.name] || t.type.name).join(' / ');
      const formattedId = `#${p.id.toString().padStart(3, '0')}`;
      
      const text = `🔴 *¡Ficha de Pokémon en Pokédex!* 🔴\n\n` +
                   `📌 *Nombre:* ${p.name.toUpperCase()} (${formattedId})\n` +
                   `⚡ *Tipo:* ${types}\n` +
                   `📏 *Altura:* ${(p.height / 10).toFixed(1)} m | ⚖️ *Peso:* ${(p.weight / 10).toFixed(1)} kg\n` +
                   `💪 *Ataque:* ${p.stats.find(s=>s.stat.name==='attack')?.base_stat || 'N/A'}\n` +
                   `🛡️ *Defensa:* ${p.stats.find(s=>s.stat.name==='defense')?.base_stat || 'N/A'}\n` +
                   `✨ *Ver Imagen:* ${p.sprites.other['official-artwork'].front_default || p.sprites.front_default}\n\n` +
                   `¡Descubre más Pokémon en la Pokédex Web! 🚀`;

      const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(whatsappUrl, '_blank');
    }

    function shareFavoritesWhatsApp() {
      if (favorites.length === 0) {
        showToast('Aún no tienes Pokémon en tu lista de favoritos', 'error');
        return;
      }

      // Find all loaded favorite pokemons
      const favList = allPokemon.filter(p => favorites.includes(p.id));
      
      let text = `🔴 *Mi Lista de Pokémon Favoritos en Pokédex* 🔴\n\n`;
      
      if (favList.length > 0) {
        favList.forEach((p, idx) => {
          const types = p.types.map(t => TYPE_TRANSLATIONS[t.type.name] || t.type.name).join('/');
          const formattedId = `#${p.id.toString().padStart(3, '0')}`;
          text += `${idx + 1}. *${p.name.toUpperCase()}* (${formattedId}) - Tipo: ${types}\n`;
        });
      } else {
        text += `Tengo ${favorites.length} Pokémon guardados en mis favoritos.\n`;
      }

      text += `\n¡Mira mi colección Pokédex! 🎮✨`;

      const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(whatsappUrl, '_blank');
    }

    function playPokemonCry() {
      if (!activePokemonDetail) return;
      
      // PokeAPI Cry Audio URL
      const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${activePokemonDetail.id}.ogg`;
      
      const audio = new Audio(cryUrl);
      const btn = document.getElementById('playCryBtn');
      btn.classList.add('bg-pokeRed', 'text-white');

      audio.play().then(() => {
        setTimeout(() => {
          btn.classList.remove('bg-pokeRed', 'text-white');
        }, 1200);
      }).catch(err => {
        console.warn('Audio playback not supported or audio file missing', err);
        showToast('Audio no disponible para este Pokémon', 'info');
        btn.classList.remove('bg-pokeRed', 'text-white');
      });
    }

    function handleSearch() {
      const input = document.getElementById('searchInput');
      currentSearch = input.value;
      
      const clearBtn = document.getElementById('clearSearchBtn');
      if (currentSearch.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      applyFiltersAndRender();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentSearch = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      applyFiltersAndRender();
    }

    function filterByType(type) {
      if (currentFilterType === type) {
        currentFilterType = null;
      } else {
        currentFilterType = type;
      }

      // Highlight active badge
      const badges = document.querySelectorAll('#typeFiltersContainer button');
      badges.forEach(b => {
        if (b.dataset.type === currentFilterType) {
          b.classList.add('ring-4', 'ring-pokeRed', 'opacity-100', 'scale-105');
        } else {
          b.classList.remove('ring-4', 'ring-pokeRed', 'scale-105');
        }
      });

      document.getElementById('clearTypeBtn').classList.toggle('hidden', !currentFilterType);
      applyFiltersAndRender();
    }

    function clearTypeFilter() {
      currentFilterType = null;
      const badges = document.querySelectorAll('#typeFiltersContainer button');
      badges.forEach(b => b.classList.remove('ring-4', 'ring-pokeRed', 'scale-105'));
      document.getElementById('clearTypeBtn').classList.add('hidden');
      applyFiltersAndRender();
    }

    function handleSort(val) {
      currentSort = val;
      applyFiltersAndRender();
    }

    function resetFilters() {
      showingFavoritesOnly = false;
      const favBtn = document.getElementById('favTabBtn');
      favBtn.classList.remove('bg-white', 'text-pokeRed', 'shadow-md');
      favBtn.classList.add('bg-white/20', 'text-white');
      document.getElementById('favTabLabel').innerText = 'Favoritos';

      clearSearch();
      clearTypeFilter();
    }

    function resetFiltersUI() {
      clearSearch();
      clearTypeFilter();
    }

    function updateFilterBanner() {
      const banner = document.getElementById('filterBanner');
      const text = document.getElementById('filterBannerText');
      let parts = [];

      if (showingFavoritesOnly) parts.push('Viendo sólo Favoritos');
      if (currentFilterType) parts.push(`Tipo: ${TYPE_TRANSLATIONS[currentFilterType] || currentFilterType}`);
      if (currentSearch) parts.push(`Búsqueda: "${currentSearch}"`);

      if (parts.length > 0) {
        banner.classList.remove('hidden');
        text.innerText = `Filtros activos: ${parts.join(' | ')}`;
      } else {
        banner.classList.add('hidden');
      }
    }

    function showLoading(isLoading) {
      const skeleton = document.getElementById('loadingSkeleton');
      const grid = document.getElementById('pokemonGrid');
      
      if (isLoading) {
        skeleton.classList.remove('hidden');
        grid.classList.add('hidden');
      } else {
        skeleton.classList.add('hidden');
        grid.classList.remove('hidden');
      }
    }

    function renderSkeletons() {
      const skeleton = document.getElementById('loadingSkeleton');
      const template = document.getElementById('skeletonTemplate').content;
      skeleton.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        skeleton.appendChild(document.importNode(template, true));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-lg' : 'fa-solid fa-moon text-lg';
    }

    // Toast Notification System
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = message;

      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-500 text-xl';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-xl';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
